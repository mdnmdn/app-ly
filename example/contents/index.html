<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shell Example</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 2rem auto;
        max-width: 40rem;
        line-height: 1.5;
      }

      section {
        margin-bottom: 1.5rem;
      }

      section h2 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
        color: #555;
      }

      @media (prefers-color-scheme: dark) {
        section h2 { color: #aaa; }
      }

      button {
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
      }

      pre {
        padding: 1rem;
        border-radius: 0.5rem;
        background: rgba(127, 127, 127, 0.15);
        overflow-x: auto;
      }

      .drop-zone {
        border: 2px dashed rgba(127, 127, 127, 0.5);
        border-radius: 0.5rem;
        padding: 1.25rem;
        text-align: center;
      }

      .drop-zone.active {
        border-color: #3a8;
      }
    </style>
  </head>
  <body>
    <h1>app-ly shell</h1>
    <p>This page is loaded from the configured <code>contents</code> path.</p>

    <section>
      <h2>Files</h2>
      <button id="save">Save note</button>
      <button id="load">Load note</button>
      <button id="notify">Notify</button>
    </section>

    <section>
      <h2>Drop &amp; clipboard</h2>
      <div id="drop-zone" class="drop-zone">Drop files here</div>
      <button id="copy-text">Copy text</button>
      <button id="copy-file">Copy CSV</button>
      <button id="paste">Read clipboard</button>
    </section>

    <section>
      <h2>Network</h2>
      <button id="fetch">Fetch JSON</button>
    </section>

    <section>
      <h2>Secure Store (keychain)</h2>
      <button id="secret-set">Set secret</button>
      <button id="secret-get">Get secret</button>
      <button id="secret-delete">Delete secret</button>
    </section>

    <section>
      <h2>HTTP Server</h2>
      <button id="http-start">Start HTTP</button>
      <button id="http-stop">Stop HTTP</button>
    </section>

    <section>
      <h2>WebSocket Server</h2>
      <button id="ws-start">Start WS</button>
      <button id="ws-stop">Stop WS</button>
    </section>

    <section>
      <h2>Run a command</h2>
      <button id="run-echo">Run echo</button>
      <button id="spawn-ping">Stream ping</button>
    </section>

    <section>
      <h2>AI (on-device)</h2>
      <p id="ai-status">Checking on-device AI…</p>
      <button id="ai-generate">Generate text</button>
      <button id="ai-object">Generate object</button>
      <button id="ai-tool">Generate with a tool</button>
      <button id="ai-stream">Stream text</button>
    </section>

    <section>
      <h2>Child Windows</h2>
      <button id="open-window">Open external window</button>
      <button id="close-window">Close external window</button>
      <button id="window-body">Get window body</button>
      <button id="window-eval">Eval in window</button>
    </section>

    <pre id="output">Ready.</pre>

    <script>
      const output = document.getElementById("output");

      function show(value) {
        output.textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      // ── Files ────────────────────────────────────────────────────────

      document.getElementById("save").addEventListener("click", async () => {
        await shell.saveFile("note.txt", `Saved at ${new Date().toISOString()}`);
        await shell.log("saved note.txt");
        show("Saved note.txt");
      });

      document.getElementById("load").addEventListener("click", async () => {
        try {
          const text = await shell.readFile("note.txt");
          show(text);
        } catch (error) {
          show(String(error));
        }
      });

      document.getElementById("notify").addEventListener("click", async () => {
        await shell.notify("Shell Example", "Notification from contents HTML");
        show("Notification sent.");
      });

      // ── Drop & clipboard ─────────────────────────────────────────────

      function summarizeFiles(files) {
        if (!files.length) return "(no files)";
        return files
          .map((file) => {
            const preview =
              file.body == null
                ? "(body omitted)"
                : file.body.length > 80
                  ? file.body.slice(0, 80) + "…"
                  : file.body;
            return `${file.name}  ${file.mime}  ${file.size}B  ${file.encoding || "-"}  ${preview}`;
          })
          .join("\n");
      }

      const dropZone = document.getElementById("drop-zone");
      shell
        .onFileDrop((event) => {
          if (event.type === "enter" || event.type === "over") {
            dropZone.classList.add("active");
            if (event.type === "enter" && event.files.length) {
              dropZone.textContent = `Drop ${event.files.map((f) => f.name).join(", ")}`;
            }
            return;
          }
          dropZone.classList.remove("active");
          dropZone.textContent = "Drop files here";
          if (event.type === "drop") show(summarizeFiles(event.files));
        })
        .catch((error) => show(String(error)));

      document.getElementById("copy-text").addEventListener("click", async () => {
        await shell.writeClipboard({ text: "hello from app-ly" });
        show("Copied text.");
      });

      document.getElementById("copy-file").addEventListener("click", async () => {
        await shell.writeClipboard({
          files: [
            {
              name: "export.csv",
              mime: "text/csv",
              body: "name,amount\nAda,12\n",
              encoding: "text",
            },
          ],
        });
        show("Copied export.csv.");
      });

      document.getElementById("paste").addEventListener("click", async () => {
        const clip = await shell.readClipboard();
        const lines = [
          `text: ${clip.text == null ? "(none)" : JSON.stringify(clip.text)}`,
          `html: ${clip.html == null ? "(none)" : JSON.stringify(clip.html)}`,
          "files:",
          summarizeFiles(clip.files),
        ];
        show(lines.join("\n"));
      });

      // ── Network ──────────────────────────────────────────────────────

      document.getElementById("fetch").addEventListener("click", async () => {
        const response = await shell.get(
          "https://jsonplaceholder.typicode.com/todos/1",
        );
        show(response);
      });

      // ── Secure Store ─────────────────────────────────────────────────

      document.getElementById("secret-set").addEventListener("click", async () => {
        await shell.secretSet("demo-app", "example-key", "secret-value-42");
        show("Secret stored in OS keychain.");
      });

      document.getElementById("secret-get").addEventListener("click", async () => {
        try {
          const value = await shell.secretGet("demo-app", "example-key");
          show(`Retrieved: ${value}`);
        } catch (error) {
          show(String(error));
        }
      });

      document.getElementById("secret-delete").addEventListener("click", async () => {
        try {
          await shell.secretDelete("demo-app", "example-key");
          show("Secret deleted from OS keychain.");
        } catch (error) {
          show(String(error));
        }
      });

      // ── HTTP Server ──────────────────────────────────────────────────

      let httpUnlisten = null;
      let httpRunning = false;

      document.getElementById("http-start").addEventListener("click", async () => {
        if (httpRunning) {
          show("HTTP server already running.");
          return;
        }
        const { port } = await shell.httpStart({ port: 0 });
        httpRunning = true;
        show(`HTTP server started on port ${port}`);

        httpUnlisten = await shell.onHttpRequest(async (req) => {
          const body = JSON.stringify({ ok: true, method: req.method, url: req.url });
          await shell.httpRespond(req.id, 200, { "Content-Type": "application/json" }, body);
        });
      });

      document.getElementById("http-stop").addEventListener("click", async () => {
        if (!httpRunning) {
          show("HTTP server not running.");
          return;
        }
        await shell.httpStop();
        if (httpUnlisten) httpUnlisten();
        httpUnlisten = null;
        httpRunning = false;
        show("HTTP server stopped.");
      });

      // ── WebSocket Server ─────────────────────────────────────────────

      let wsUnlistenConn = null;
      let wsUnlistenMsg = null;
      let wsUnlistenClose = null;
      let wsRunning = false;

      document.getElementById("ws-start").addEventListener("click", async () => {
        if (wsRunning) {
          show("WebSocket server already running.");
          return;
        }
        const { port } = await shell.wsStart({ port: 0 });
        wsRunning = true;
        show(`WebSocket server started on port ${port}`);

        wsUnlistenConn = await shell.onWsConnection(({ id }) => {
          show(`Client connected: ${id}`);
          shell.wsSend(id, "Welcome from app-ly!");
        });

        wsUnlistenMsg = await shell.onWsMessage(({ id, data }) => {
          show(`Message from ${id}: ${data}`);
        });

        wsUnlistenClose = await shell.onWsClose(({ id }) => {
          show(`Client disconnected: ${id}`);
        });
      });

      document.getElementById("ws-stop").addEventListener("click", async () => {
        if (!wsRunning) {
          show("WebSocket server not running.");
          return;
        }
        await shell.wsStop();
        if (wsUnlistenConn) wsUnlistenConn();
        if (wsUnlistenMsg) wsUnlistenMsg();
        if (wsUnlistenClose) wsUnlistenClose();
        wsUnlistenConn = null;
        wsUnlistenMsg = null;
        wsUnlistenClose = null;
        wsRunning = false;
        show("WebSocket server stopped.");
      });

      // ── Run a command ────────────────────────────────────────────────

      document.getElementById("run-echo").addEventListener("click", async () => {
        try {
          const result = await shell.run("echo", ["hello from app-ly"], {
            timeoutMs: 5000,
          });
          show(
            [
              `exit code: ${result.code}`,
              `signal: ${result.signal}`,
              `timed out: ${result.timedOut}`,
              "",
              `stdout: ${result.stdout}`,
              `stderr: ${result.stderr}`,
            ].join("\n"),
          );
        } catch (error) {
          show(String(error));
        }
      });

      document.getElementById("spawn-ping").addEventListener("click", async () => {
        try {
          const proc = await shell.spawn("ping", ["-c", "3", "127.0.0.1"], {
            timeoutMs: 10000,
          });
          let text = `ping (${proc.id}, pid ${proc.pid})\n\n`;
          show(text);

          for await (const { stream, data } of proc) {
            text += stream === "stderr" ? `[stderr] ${data}` : data;
            show(text);
          }

          const { code, timedOut } = await proc.exited;
          show(`${text}\n-- exit code ${code}${timedOut ? " (timed out)" : ""}`);
        } catch (error) {
          show(String(error));
        }
      });

      // ── AI ───────────────────────────────────────────────────────────

      const aiStatus = document.getElementById("ai-status");

      function describeAi(info) {
        if (info.available) {
          const models = info.models.map((m) => m.id).join(", ") || "none";
          return `On-device AI available — models: ${models}`;
        }
        return `On-device AI unavailable — ${info.reason}${
          info.detail ? ` (${info.detail})` : ""
        }`;
      }

      // shell.ai.info() never rejects, so this is safe to call on load.
      shell.ai.info().then((info) => {
        aiStatus.textContent = describeAi(info);
      });

      // Every AI button degrades to a visible message when the model is not
      // available, instead of failing silently in the console.
      async function withAi(run) {
        const info = await shell.ai.info();
        aiStatus.textContent = describeAi(info);
        if (!info.available) {
          show(describeAi(info));
          return;
        }
        try {
          await run();
        } catch (error) {
          show(String(error));
        }
      }

      document.getElementById("ai-generate").addEventListener("click", () =>
        withAi(async () => {
          show("Generating…");
          const result = await shell.ai.generate("Write a haiku about desktop apps.", {
            instructions: "You are concise.",
            maxTokens: 200,
          });
          show(`${result.text}\n\n-- model: ${result.model}`);
        }),
      );

      document.getElementById("ai-object").addEventListener("click", () =>
        withAi(async () => {
          show("Generating…");
          const schema = {
            type: "object",
            properties: {
              title: { type: "string", description: "Short title" },
              tags: { type: "array", items: { type: "string" } },
              rating: { type: "integer" },
            },
            required: ["title", "tags", "rating"],
          };
          const result = await shell.ai.generateObject(
            "Describe the app-ly desktop shell.",
            schema,
          );
          show(result.object);
        }),
      );

      document.getElementById("ai-tool").addEventListener("click", () =>
        withAi(async () => {
          show("Generating…");
          const result = await shell.ai.generate(
            "What time is it right now? Use the get_time tool.",
            {
              tools: [
                {
                  name: "get_time",
                  description: "Returns the current local time as an ISO 8601 string.",
                  parameters: { type: "object", properties: {} },
                  handler: () => ({ time: new Date().toISOString() }),
                },
              ],
            },
          );
          const ran = result.toolCalls
            .map((call) =>
              call.error
                ? `${call.name} -> error: ${call.error}`
                : `${call.name} -> ${JSON.stringify(call.result)}`,
            )
            .join("\n");
          show(`${result.text}\n\n-- tools that ran --\n${ran || "(none)"}`);
        }),
      );

      document.getElementById("ai-stream").addEventListener("click", () =>
        withAi(async () => {
          const stream = await shell.ai.stream("Count from one to ten in words.");
          let text = "";
          show("Streaming…");
          for await (const delta of stream) {
            text += delta;
            show(text);
          }
          const result = await stream.completed;
          show(`${result.text}\n\n-- model: ${result.model}`);
        }),
      );

      // ── Child Windows ────────────────────────────────────────────────

      let externalWindowId = null;
      let unlistenNav = null;
      let unlistenClosed = null;

      document.getElementById("open-window").addEventListener("click", async () => {
        const { id } = await shell.openWindow("https://example.com", {
          title: "External window example",
          width: 480,
          height: 640,
        });
        externalWindowId = id;
        show(`Opened external window: ${id}`);

        unlistenNav = await shell.onWindowNavigated((windowId, url) => {
          if (windowId !== externalWindowId) return;
          show(`External window navigated to: ${url}`);
        });

        unlistenClosed = await shell.onWindowClosed((windowId) => {
          if (windowId !== externalWindowId) return;
          show("External window closed");
          externalWindowId = null;
          if (unlistenNav) unlistenNav();
          if (unlistenClosed) unlistenClosed();
        });
      });

      document.getElementById("close-window").addEventListener("click", async () => {
        if (!externalWindowId) {
          show("No external window open");
          return;
        }
        await shell.closeWindow(externalWindowId);
      });

      document.getElementById("window-body").addEventListener("click", async () => {
        if (!externalWindowId) {
          show("No external window open");
          return;
        }
        const text = await shell.getWindowBody(externalWindowId);
        show(text);
      });

      document.getElementById("window-eval").addEventListener("click", async () => {
        if (!externalWindowId) {
          show("No external window open");
          return;
        }
        const title = await shell.evalWindow(externalWindowId, "return document.title;");
        show(`External window title: ${title}`);
      });
    </script>
  </body>
</html>
