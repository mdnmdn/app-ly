[package]
name = "app-ly"
version = "0.29.0"
description = "Generic Tauri shell container"
authors = ["you"]
edition = "2021"

[lib]
name = "app_ly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["ai-apple"]
# On-device AI backed by the platform framework. Off => the stub backend,
# which reports shell.ai as unavailable. Turn it off to build on an older
# macOS SDK, or without a Swift toolchain.
ai-apple = ["dep:foundation-models"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
notify-rust = "4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rusqlite = { version = "0.32", features = ["bundled"] }
open = "5"
keyring = "4"
tiny_http = "0.12"
tungstenite = "0.24"
regex = "1"
base64 = "0.22"
clipboard-rs = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Optional: pulled in only by the `ai-apple` feature. Compiles a Swift bridge
# at build time, so it needs Xcode 26 / the macOS 26 SDK.
foundation-models = { version = "0.11", features = ["macos_26_0"], optional = true }
