[[permission]]
identifier = "shell-commands"
description = "Shell container invoke commands"
commands.allow = [
  "shell_save_file",
  "shell_read_file",
  "shell_delete_file",
  "shell_rename_file",
  "shell_open_file",
  "shell_open_file_location",
  "shell_read_clipboard",
  "shell_write_clipboard",
  "shell_log",
  "shell_notify",
  "shell_fetch",
  "shell_get_window_position",
  "shell_set_window_position",
  "shell_get_window_size",
  "shell_set_window_size",
  "shell_minimize_window",
  "shell_get_screens",
  "shell_get_screen_at",
  "shell_db_query",
  "shell_db_execute",
  "shell_db_close",
  "shell_toggle_devtools",
  "shell_open_window",
  "shell_close_window",
  "shell_get_window_body",
  "shell_eval_window",
  "shell_auth_via_browser",
  "shell_secret_set",
  "shell_secret_get",
  "shell_secret_delete",
  "shell_http_start",
  "shell_http_respond",
  "shell_http_stop",
  "shell_ws_start",
  "shell_ws_send",
  "shell_ws_close",
  "shell_ws_stop",
  "shell_run",
  "shell_spawn",
  "shell_process_write",
  "shell_process_close_stdin",
  "shell_process_kill",
  "shell_process_exit",
  "shell_process_set_timeout",
  "shell_list_commands",
  "shell_ai_info",
  "shell_ai_generate",
  "shell_ai_generate_object",
  "shell_ai_stream",
  "shell_ai_tool_result",
  "shell_ai_cancel",
]

# Reported by a child window's own script (via window.__TAURI__.core.invoke)
# to deliver an evalWindow/getWindowBody result back — kept separate from
# shell-commands above so child windows don't get the full shell surface.
[[permission]]
identifier = "shell-eval-result"
description = "Allows reporting an evalWindow/getWindowBody result back to the shell"
commands.allow = ["shell_eval_result"]