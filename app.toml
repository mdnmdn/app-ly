icon = "example/icon.png"
name = "Shell Example"
contents = "example/contents"
dataPath = "example/data"
keychainPrefix = "app-ly-dev"

# Programs the contents HTML may run via `shell.run` / `shell.spawn`.
[[allowedCommands]]
name = "echo"
program = "echo"

[[allowedCommands]]
name = "ping"
program = "ping"
args = ["^-c$", "^[1-9]$", "^(127\\.0\\.0\\.1|localhost)$"]
timeoutMs = 10000

# On-device AI (`shell.ai`). Everything here is optional — uncomment to change
# a default. See app.toml.example for what each key does.
# [ai]
# enabled = true
# instructions = "Answer briefly and in plain text."
# temperature = 0.7
# maxTokens = 512
# toolTimeoutMs = 30000
